name: Weekly Brave policy template check

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-templates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The check always compares and rewrites main, also when it is started by hand from another branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Download latest policy templates
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://brave-browser-downloads.s3.brave.com/latest/policy_templates.zip' -OutFile "$env:RUNNER_TEMP/policy_templates.zip"

      - name: Compare with the recorded snapshot
        id: compare
        shell: pwsh
        run: ./scripts/Compare-PolicyTemplates.ps1 -TemplateZipPath "$env:RUNNER_TEMP/policy_templates.zip" -SummaryPath "$env:RUNNER_TEMP/summary.md" -Update

      - name: Record the new template version
        if: steps.compare.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/Update-PolicyTemplateVersion.ps1 -TemplateZipPath "$env:RUNNER_TEMP/policy_templates.zip"

      - name: Validate the manifest against the new templates
        id: validate
        if: steps.compare.outputs.changed == 'true'
        shell: pwsh
        run: |
          $failed = $false
          $result = try {
            ./scripts/Test-LatestPolicyTemplates.ps1 -TemplateZipPath "$env:RUNNER_TEMP/policy_templates.zip" -RequireVersionMatch *>&1 | Out-String | Write-Host
            "Manifest validation passed."
          }
          catch {
            $failed = $true
            "**Manifest validation failed:** $($_.Exception.Message)"
          }
          Add-Content -LiteralPath "$env:RUNNER_TEMP/summary.md" -Value "`n### Manifest validation`n$result"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "failed=$($failed.ToString().ToLowerInvariant())"

      # The comparison must be readable even when no pull request or issue could be written.
      - name: Show the comparison on the run page
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runs every week, so a fallback issue also closes once its update is merged and the templates stop changing.
      - name: Open or update the pull request, or report through an issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATES_CHANGED: ${{ steps.compare.outputs.changed }}
          TEMPLATE_VERSION: ${{ steps.compare.outputs.template_version }}
        run: ./scripts/Publish-PolicyTemplateUpdate.ps1 -Version $env:TEMPLATE_VERSION -Repository $env:GITHUB_REPOSITORY -ServerUrl $env:GITHUB_SERVER_URL -TemplatesChanged:($env:TEMPLATES_CHANGED -eq 'true') -SummaryPath "$env:RUNNER_TEMP/summary.md" -WorkDirectory $env:RUNNER_TEMP

      - name: Fail when the manifest no longer validates
        if: always() && steps.validate.outputs.failed == 'true'
        shell: bash
        run: |
          echo "::error::config/policies.json does not validate against Brave policy templates ${{ steps.compare.outputs.template_version }}. See this run's summary and the automation PR or issue for details."
          exit 1
